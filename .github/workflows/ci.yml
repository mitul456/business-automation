name: CI Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Typecheck & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.16.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema
        run: pnpm --filter @omniflow/database prisma validate

      - name: Generate Prisma Client
        run: pnpm --filter @omniflow/database prisma generate

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Build Verification (TypeScript & Next.js Bundle)
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Run Automated Test Suites (Unit, Integration, Security)
        run: pnpm run test -- --ci --runInBand --detectOpenHandles
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_ci_environment_32chars
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_ci_environment
          TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
