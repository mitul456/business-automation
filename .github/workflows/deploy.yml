name: CD Production Deployment

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      tag_version:
        description: 'Image Tag / Version'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-images:
    name: Build & Push Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:${{ github.sha }}
            ghcr.io/${{ github.repository }}/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production Cluster
    needs: build-and-push-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Human approval gate enforced via GitHub Protected Environment
    environment:
      name: production
      url: https://omniflow.app

    steps:
      - name: Checkout Deployment Scripts
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 Initiating OmniFlow Zero-Downtime Deployment..."
            cd /opt/omniflow

            # 1. Pull latest images
            docker compose -f docker-compose.prod.yml pull

            # 2. Run Database Migrations safely
            docker compose -f docker-compose.prod.yml run --rm api pnpm --filter @omniflow/database prisma migrate deploy

            # 3. Rolling update of backend and worker services
            docker compose -f docker-compose.prod.yml up -d --no-deps api worker web

            # 4. Verify API Healthcheck
            echo "🔍 Verifying API Healthcheck..."
            sleep 10
            for i in {1..12}; do
              if curl -s -f http://127.0.0.1:4000/api/v1/health | grep -q '"status":"ok"'; then
                echo "✅ API Health verified healthy!"
                break
              fi
              echo "Waiting for API to pass healthcheck... ($i/12)"
              sleep 5
            done

            # 5. Reload Nginx configuration without dropping connections
            docker compose -f docker-compose.prod.yml exec nginx nginx -s reload

            echo "🎉 OmniFlow Production Deployment Completed Successfully!"
