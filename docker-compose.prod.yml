# ==============================================================================
# OmniFlow SaaS — Production Docker Compose Orchestration
# ==============================================================================
version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Relational Database — MySQL 8.0 (utf8mb4_unicode_ci)
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: omniflow_prod_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-omniflow_prod_root_pass}
      MYSQL_DATABASE: ${DB_NAME:-omniflow_db}
      MYSQL_USER: ${DB_USER:-omniflow_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-omniflow_secure_db_pass_2026}
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=300
      --innodb_buffer_pool_size=1G
      --innodb_log_file_size=256M
    networks:
      - omniflow_backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-omniflow_prod_root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 2. In-Memory Cache & Message Broker — Redis 7 Alpine
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: omniflow_prod_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-omniflow_redis_secure_pass_2026}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis_prod_data:/data
    networks:
      - omniflow_backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-omniflow_redis_secure_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Object Storage Engine — MinIO (S3 Compatible)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: omniflow_prod_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-omniflow_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-omniflow_minio_secure_pass_2026}
    command: server /data --console-address ":9001"
    volumes:
      - minio_prod_data:/data
    networks:
      - omniflow_backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 4. Backend Application — NestJS API Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: omniflow_prod_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${DB_USER:-omniflow_user}:${DB_PASSWORD:-omniflow_secure_db_pass_2026}@mysql:3306/${DB_NAME:-omniflow_db}?connection_limit=25
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-omniflow_redis_secure_pass_2026}
      REDIS_URL: redis://:${REDIS_PASSWORD:-omniflow_redis_secure_pass_2026}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-omniflow_jwt_ultra_secret_key_prod_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-omniflow_jwt_refresh_ultra_secret_prod_2026}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_URL: ${APP_URL:-https://omniflow.antcodes.dev}
      API_URL: ${API_URL:-https://omniflow.antcodes.dev/api/v1}
      S3_ENDPOINT: minio:9000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-omniflow_minio_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-omniflow_minio_secure_pass_2026}
      S3_BUCKET: ${S3_BUCKET:-omniflow-storage}
    networks:
      - omniflow_backend
      - omniflow_frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 5. Background Engine — BullMQ Worker Processor
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: omniflow_prod_worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${DB_USER:-omniflow_user}:${DB_PASSWORD:-omniflow_secure_db_pass_2026}@mysql:3306/${DB_NAME:-omniflow_db}?connection_limit=15
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-omniflow_redis_secure_pass_2026}
      REDIS_URL: redis://:${REDIS_PASSWORD:-omniflow_redis_secure_pass_2026}@redis:6379
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
    networks:
      - omniflow_backend

  # ----------------------------------------------------------------------------
  # 6. Frontend Client — Next.js 15 Standalone Runner
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: omniflow_prod_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_URL: ${APP_URL:-https://omniflow.antcodes.dev}
      NEXT_PUBLIC_API_URL: ${API_URL:-https://omniflow.antcodes.dev/api/v1}
    networks:
      - omniflow_frontend

  # ----------------------------------------------------------------------------
  # 7. Reverse Proxy & Edge Router — Nginx (SSL Termination + HTTP/2 + WS)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: omniflow_prod_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/www/certbot:ro
    depends_on:
      - web
      - api
    networks:
      - omniflow_frontend

  # ----------------------------------------------------------------------------
  # 8. Automated SSL Provisioning & Renewal — Certbot
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: omniflow_prod_certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - omniflow_frontend

# ==============================================================================
# Persistent Volumes & Network Isolation
# ==============================================================================
volumes:
  mysql_prod_data:
    name: omniflow_mysql_prod_data
  redis_prod_data:
    name: omniflow_redis_prod_data
  minio_prod_data:
    name: omniflow_minio_prod_data
  certbot_etc:
    name: omniflow_certbot_etc
  certbot_var:
    name: omniflow_certbot_var

networks:
  omniflow_backend:
    name: omniflow_backend_net
    internal: true # Isolated backend network; no direct public internet exposure
  omniflow_frontend:
    name: omniflow_frontend_net
